<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Motion Showreel</title>
<style>
@font-face { font-family: Display; src: url(fonts/texgyreheros-bold.woff2); font-weight: 700; }
html, body { margin: 0; background: #000; }
canvas { display: block; width: 1080px; height: 1920px; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="beats.js"></script>
<script>
// Every frame is a pure function of time: window.seek(t) paints frame t.
// No transitions, timers or carried state. Noise is seeded (hash), never Math.random.
const W = 1080, H = 1920, DUR = 15;
const c = document.getElementById('c'), g = c.getContext('2d');
const INK = '#0E0E0E', PAPER = '#F1EDE4', ACC = '#FF4D1A';
const DISP = 'Display, "Helvetica Neue", Arial, sans-serif';
const UI = 'Menlo, "SF Mono", monospace';
const BEAT = BEATS.beatSec;
const TAU = Math.PI * 2;

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const E = {
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  outBack: x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); },
  inOutBack: x => { const c2 = 1.70158 * 1.525; return x < .5 ? (Math.pow(2 * x, 2) * ((c2 + 1) * 2 * x - c2)) / 2 : (Math.pow(2 * x - 2, 2) * ((c2 + 1) * (x * 2 - 2) + c2) + 2) / 2; },
  outElastic: x => x <= 0 ? 0 : x >= 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - .75) * (TAU / 3)) + 1,
};
function hash(n) { n = n | 0; n = (n ^ 61) ^ (n >>> 16); n = (n + (n << 3)) | 0; n = n ^ (n >>> 4); n = Math.imul(n, 0x27d4eb2d); n = n ^ (n >>> 15); return (n >>> 0) / 4294967296; }
const rnd = (a, b = 0, d = 0) => hash((a * 73856093) ^ (b * 19349663) ^ (d * 83492791));

window.ready = document.fonts.load('700 100px Display').catch(() => {});

function bg(col) { g.fillStyle = col; g.fillRect(-120, -120, W + 240, H + 240); }
function setFont(size, font = DISP) {
  g.font = `700 ${size}px ${font}`;
  g.letterSpacing = (font === DISP ? -0.035 : 0.06) * size + 'px';
}
function measure(s, size, font = DISP) { setFont(size, font); return g.measureText(s).width; }
function fit(s, w, cap) { return Math.min(cap, 100 * w / measure(s, 100)); }
function circle(x, y, r) { if (r <= 0) return; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); }
function ui(s, x, y, size, col) { setFont(size, UI); g.fillStyle = col; g.textBaseline = 'alphabetic'; g.textAlign = 'left'; g.fillText(s, x, y); }
// a word that rises out of a mask: a = seconds since it appeared
function word(s, x, base, size, a, col = INK, dur = .18, lead = .06) {
  if (a < -lead) return;
  const p = E.outExpo(clamp((a + lead) / dur)), h = size * .74;
  g.save(); g.beginPath(); g.rect(-200, base - h - 6, W + 400, h + size * .26); g.clip();
  setFont(size); g.fillStyle = col; g.textBaseline = 'alphabetic'; g.textAlign = 'left';
  g.fillText(s, x, base + (1 - p) * size * 1.05); g.restore();
}

/* ---------- 1 · I MAKE THINGS MOVE. (0-2s, accent) ---------- */
function s1(ls) {
  bg(ACC);
  const words = ['I', 'MAKE', 'THINGS', 'MOVE.'];
  const sz = [fit('I', 1000, 700), fit('MAKE', 950, 500), fit('THINGS', 950, 500), fit('MOVE.', 950, 500)];
  const hs = sz.map(s => s * .74), gap = 62;
  const total = hs.reduce((a, b) => a + b, 0) + gap * 3;
  let y = (H - total) / 2 + 30;
  const y0 = y;
  words.forEach((w, i) => {
    const base = y + hs[i];
    word(w, 62, base, sz[i], ls - i * BEAT, INK, .2, i === 0 ? .2 : .06);
    if (i === 0 && ls > 0) {
      const r = hs[0] * .3 * E.outBack(clamp((ls + .12) / .4));
      g.fillStyle = PAPER; circle(62 + measure('I', sz[0]) + 150, base - hs[0] * .5, r);
    }
    if (i === 3 && ls > 1.6) {
      const u = E.outExpo(clamp((ls - 1.6) / .25));
      g.fillStyle = INK; g.fillRect(62, base + 34, 950 * u, 16);
    }
    y += hs[i] + gap;
  });
  if (ls > -1) { const n = Math.floor(clamp(ls * 70, 0, 40)); ui('MOTION DESIGN SHOWREEL 2026'.slice(0, n + 2), 62, y0 - 44, 34, INK); }
}

/* ---------- 2 · EASING STUDY (2-4s, paper) ---------- */
const C2 = [['EXPO', E.outExpo, 'EASE OUT'], ['BACK', E.inOutBack, 'EASE IN-OUT'], ['ELASTIC', E.outElastic, 'EASE OUT'], ['CUBIC', E.inOutCubic, 'EASE IN-OUT']];
function s2(ls) {
  bg(PAPER);
  const b = Math.min(3, Math.floor(ls / BEAT)), a = ls - b * BEAT;
  const N = 27, bw = 28, gap = (W - N * bw) / (N + 1), base = 1400, maxH = 900;
  const tgt = (bb, i) => bb < 0 ? 0 : .18 + .82 * (.5 + .5 * Math.sin(i * .52 + bb * 2.1 + (bb % 2 ? 1.7 : 0)));
  let top = 0, topI = 0;
  for (let i = 0; i < N; i++) if (tgt(b, i) > top) { top = tgt(b, i); topI = i; }
  for (let i = 0; i < N; i++) {
    const p = clamp((a - i * .010) / .36), e = C2[b][1](p);
    const h = Math.max(3, lerp(tgt(b - 1, i), tgt(b, i), e) * maxH);
    g.fillStyle = i === topI ? ACC : INK;
    g.fillRect(gap + i * (bw + gap), base - h, bw, h);
  }
  const size = fit(C2[b][0], 950, 330);
  word(C2[b][0], 62, 170 + size * .74, size, a);
  // the curve itself, with a dot riding it
  const bx = 62, by = 1500, bs = 340, p = clamp(a / .36), f = C2[b][1];
  g.strokeStyle = INK; g.lineWidth = 5; g.strokeRect(bx, by, bs, bs);
  g.beginPath();
  for (let k = 0; k <= 60; k++) { const u = k / 60, px = bx + u * bs, py = by + bs - f(u) * bs; k ? g.lineTo(px, py) : g.moveTo(px, py); }
  g.lineWidth = 7; g.stroke();
  g.fillStyle = ACC; circle(bx + p * bs, by + bs - f(p) * bs, 20);
  ui(C2[b][2], 470, 1560, 54, INK);
  ui(`CURVE 0${b + 1} / 04`, 470, 1632, 34, INK);
}

/* ---------- 3 · TILE MORPH (4-6s, ink) ---------- */
const ST = [{ r: 0, rot: 0, s: .86 }, { r: 1, rot: 0, s: .86 }, { r: 0, rot: Math.PI / 4, s: .64 }, { r: 1, rot: Math.PI / 2, s: .3 }];
const OR = [[540, 960], [0, 0], [1080, 1920], [1080, 0]];
function s3(ls) {
  bg(INK);
  const b = Math.min(3, Math.floor(ls / BEAT)), a = ls - b * BEAT;
  const cell = 135, cols = 8, rows = 15, oy = (H - rows * cell) / 2;
  const from = b ? ST[b - 1] : { r: 0, rot: 0, s: 0 }, to = ST[b];
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    const cx = i * cell + cell / 2, cy = oy + j * cell + cell / 2;
    const d = Math.hypot(cx - OR[b][0], cy - OR[b][1]) / 2300;
    const raw = (a - d * .5) / .3, p = clamp(raw), e = E.outBack(p);
    const r = clamp(lerp(from.r, to.r, e)), rot = lerp(from.rot, to.rot, e), s = Math.max(0, lerp(from.s, to.s, e)) * cell;
    g.fillStyle = (raw > 0 && raw < 1) ? ACC : PAPER;
    g.save(); g.translate(cx, cy); g.rotate(rot); g.beginPath();
    g.roundRect(-s / 2, -s / 2, s, s, Math.min(s / 2, r * s / 2)); g.fill(); g.restore();
  }
}

/* ---------- 4 · SLICED TYPE (6-8s, paper) ---------- */
function s4(ls) {
  bg(PAPER);
  const b = Math.min(3, Math.floor(ls / BEAT)), bt = ls - b * BEAT;
  const unit = 'MOTION TYPE ', rows = 9, rh = H / rows, fs = 190;
  g.lineWidth = 3; g.strokeStyle = INK;
  const w1 = measure(unit, fs);
  for (let r = 0; r < rows; r++) {
    const dir = r % 2 ? 1 : -1, off = dir * (b + E.outExpo(clamp(bt / .35))) * 430 + r * 90;
    let x = -(((off % w1) + w1) % w1) - w1;
    setFont(fs); g.textBaseline = 'alphabetic';
    for (; x < W; x += w1) g.strokeText(unit, x, (r + 1) * rh - 38);
  }
  const wd = ['TYPE', 'MOVES', 'LIKE', 'THIS.'][b];
  const size = fit(wd, 950, 560), h = size * .74, base = H / 2 + h / 2;
  g.fillStyle = PAPER; g.fillRect(0, base - h - 50, W, h + 100);
  g.fillStyle = INK; g.fillRect(0, base - h - 50, W, 6); g.fillRect(0, base + 44, W, 6);
  const N = 6, sh = h / N;
  for (const layer of [0, 1]) for (let j = 0; j < N; j++) {
    const off = (rnd(j, b, 3) - .5) * 2 * 120 * Math.exp(-bt * 16);
    g.save(); g.beginPath(); g.rect(-300, base - h + j * sh, W + 600, sh + 1); g.clip();
    setFont(size); g.textBaseline = 'alphabetic'; g.textAlign = 'left';
    g.fillStyle = layer ? INK : ACC;
    g.fillText(wd, 62 + off + (layer ? 0 : 18), base + (layer ? 0 : 18));
    g.restore();
  }
}

/* ---------- 5 · TORUS KNOT (8-10s, ink) ---------- */
function s5(ls) {
  bg(INK);
  const b = Math.min(3, Math.floor(ls / BEAT)), a = ls - b * BEAT;
  const P = [[2, 3], [2, 5], [3, 4], [3, 5]];
  const m = E.outExpo(clamp(a / .4));
  const p0 = b ? P[b - 1] : P[0], p1 = P[b];
  const p = lerp(p0[0], p1[0], m), q = lerp(p0[1], p1[1], m);
  const ay = ls * 1.7 + b * .5, ax = .9 + .25 * Math.sin(ls * 2.2), zoom = 1 + .12 * Math.exp(-a * 9);
  const N = 520, S = 190, pts = [];
  for (let i = 0; i <= N; i++) {
    const u = i / N * TAU, r = Math.cos(q * u) + 2;
    const x = r * Math.cos(p * u), y = r * Math.sin(p * u), z = -Math.sin(q * u);
    const x1 = x * Math.cos(ay) + z * Math.sin(ay), z1 = -x * Math.sin(ay) + z * Math.cos(ay);
    const y2 = y * Math.cos(ax) - z1 * Math.sin(ax), z2 = y * Math.sin(ax) + z1 * Math.cos(ax);
    const f = 7 / (7 + z2);
    pts.push([W / 2 + x1 * S * f * zoom, H / 2 + y2 * S * f * zoom, (z2 + 3) / 6]);
  }
  const count = Math.floor(N * E.outCubic(clamp(ls / .8)));
  const head = Math.floor(((ls * .7) % 1) * N);
  g.lineCap = 'round';
  for (let i = 0; i < count; i++) {
    const A = pts[i], B = pts[i + 1], t = (A[2] + B[2]) / 2;
    const hot = ((head - i + N) % N) < 90 && ls > .8;
    g.strokeStyle = hot || i > count - 50 && ls < .8 ? ACC : PAPER;
    g.globalAlpha = .3 + .7 * clamp(t); g.lineWidth = 9 + 24 * clamp(t) + (hot ? 6 : 0);
    g.beginPath(); g.moveTo(A[0], A[1]); g.lineTo(B[0], B[1]); g.stroke();
  }
  g.globalAlpha = 1;
  const n = Math.min(24, Math.floor(ls * 40));
  ui(`TORUS KNOT  P=${p.toFixed(1)}  Q=${q.toFixed(1)}`.slice(0, n + 4), 62, 1830, 34, PAPER);
}

/* ---------- 6 · NUMBERS (10-12s, accent) ---------- */
const ROWS = [{ n: '60', label: 'FRAMES PER SECOND' }, { n: '240', label: 'SAMPLES PER SECOND' }, { n: '100', label: 'PERCENT DETERMINISTIC' }];
function s6content(ls, col) {
  for (let r = 0; r < 3; r++) {
    const a = ls - r * BEAT; if (a < 0) continue;
    const size = 400, hs = size * .74, base = 420 + r * 560, stride = size * .95;
    setFont(size); const dw = measure('0', size);
    g.save(); g.beginPath(); g.rect(0, base - hs - 6, W, hs + 14); g.clip();
    setFont(size); g.fillStyle = col; g.textAlign = 'left'; g.textBaseline = 'alphabetic';
    [...ROWS[r].n].forEach((ch, j) => {
      const e = E.outExpo(clamp((a - j * .05) / .6)), pos = +ch + (1 - e) * (12 + j * 4);
      for (let n = Math.floor(pos) - 1; n <= Math.floor(pos) + 2; n++)
        g.fillText(String(((n % 10) + 10) % 10), 62 + j * dw, base + (n - pos) * stride);
    });
    g.restore();
    const k = Math.floor(clamp(a - .15, 0, 1) * 70);
    ui(ROWS[r].label.slice(0, k), 62, base + 66, 38, col);
    g.fillStyle = col; g.fillRect(62, base + 100, 950 * E.outExpo(clamp((a - .1) / .6)), 14);
  }
}
function s6(ls) {
  bg(ACC); s6content(ls, INK);
  const inv = E.outExpo(clamp((ls - 1.5) / .3));
  if (inv > 0) { g.save(); g.beginPath(); g.rect(0, 0, W * inv, H); g.clip(); bg(INK); s6content(ls, ACC); g.restore(); }
}

/* ---------- 7 · QUICK CUTS (12-14s, mixed) ---------- */
function s7(ls) {
  const k = Math.min(7, Math.floor(ls / .25)), q = clamp((ls - k * .25) / .25), e = E.outExpo(clamp(q * 1.6));
  bg([PAPER, INK, ACC, PAPER, INK, ACC, PAPER, INK][k]);
  const cx = W / 2, cy = H / 2;
  if (k === 0) { g.fillStyle = INK; circle(330, 780, 640 * e); g.fillStyle = ACC; circle(780, 1340, 320 * E.outBack(clamp(q * 1.4))); }
  else if (k === 1) {
    g.lineWidth = 24;
    for (let i = 0; i < 7; i++) { const r = ((q * .9 + i / 7) % 1) * 1250; g.strokeStyle = i === 0 ? ACC : PAPER; g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.stroke(); }
  } else if (k === 2) {
    g.save(); g.translate(cx, cy); g.rotate(-.5); g.fillStyle = INK;
    for (let i = -14; i <= 14; i++) g.fillRect(i * 150 + (q - .5) * 150, -1700, 84 * e, 3400);
    g.restore();
  } else if (k === 3) {
    g.fillStyle = ACC; g.save(); g.translate(cx, cy); g.rotate(-1.2 + 2.1 * e); g.beginPath();
    const R = 700 * E.outBack(clamp(q * 1.4));
    for (let i = 0; i < 3; i++) { const an = i * TAU / 3 - Math.PI / 2; i ? g.lineTo(Math.cos(an) * R, Math.sin(an) * R) : g.moveTo(Math.cos(an) * R, Math.sin(an) * R); }
    g.fill(); g.restore();
    g.fillStyle = INK; for (const [x, y] of [[0, 0], [W, 0], [0, H], [W, H]]) circle(x, y, 300 * e);
  } else if (k === 4) {
    g.fillStyle = PAPER;
    for (let j = 0; j < 12; j++) for (let i = 0; i < 7; i++) {
      const r = 56 * (.5 + .5 * Math.sin(q * 7 - (i + j) * .7)) * E.outCubic(clamp(q * 2.5));
      circle(77 + i * 154, 104 + j * 156, r);
    }
    g.fillStyle = ACC; circle(cx, cy, 150 * e);
  } else if (k === 5) {
    g.fillStyle = INK; g.fillRect(0, -(1 - e) * H, W / 2 - 10, H); g.fillRect(W / 2 + 10, (1 - e) * H, W / 2 - 10, H);
    g.fillStyle = PAPER; circle(cx, cy, 240 * E.outBack(clamp(q * 1.5)));
  } else if (k === 6) {
    g.strokeStyle = ACC; g.lineWidth = 160; g.beginPath(); g.arc(cx, cy, 380, -Math.PI / 2, -Math.PI / 2 + TAU * e); g.stroke();
    const an = -Math.PI / 2 + TAU * e; g.fillStyle = INK; circle(cx + Math.cos(an) * 380, cy + Math.sin(an) * 380, 96);
    g.strokeStyle = INK; g.lineWidth = 10; g.beginPath(); g.arc(cx, cy, 590, 0, TAU); g.stroke();
  } else {
    const n = 21, bw = W / n;
    for (let i = 0; i < n; i++) { const h = (.25 + .75 * rnd(i, 7)) * H * e; g.fillStyle = i === 10 ? ACC : PAPER; g.fillRect(i * bw + 4, cy - h / 2, bw - 8, h); }
  }
}

/* ---------- 8 · LET'S MAKE IT MOVE. (14-15s, ink) ---------- */
function s8(ls) {
  bg(INK);
  const L = ["LET'S", 'MAKE IT', 'MOVE.'];
  const sz = L.map(s => fit(s, 950, 520)), hs = sz.map(s => s * .74), gap = 56;
  let y = (H - (hs[0] + hs[1] + hs[2] + gap * 2)) / 2 - 40, last = 0;
  L.forEach((s, i) => { const base = y + hs[i]; word(s, 62, base, sz[i], ls - i * .1, i === 2 ? ACC : PAPER); y += hs[i] + gap; last = base; });
  g.fillStyle = PAPER; g.fillRect(62, last + 36, 950 * E.outExpo(clamp((ls - .5) / .4)), 16);
  const k = Math.floor(clamp(ls - .55, 0, 1) * 70);
  ui('MOTION DESIGN SHOWREEL 2026'.slice(0, k), 62, last + 130, 34, PAPER);
}

const SCENES = [s1, s2, s3, s4, s5, s6, s7, s8];

/* ---------- transitions ---------- */
const TB = BEATS.scenes.slice(1), TC = [INK, ACC, ACC, INK, PAPER, INK, ACC], TW = .1;
function cover(type, p, rev, col) {
  g.fillStyle = col;
  if (type === 0) { rev ? g.fillRect(-10, -10, W + 20, (H + 10) * p) : g.fillRect(-10, H - (H + 10) * p, W + 20, (H + 10) * p + 10); }
  else if (type === 1) {
    if (!rev) circle(W / 2, H / 2, p * 1250);
    else { g.beginPath(); g.rect(-10, -10, W + 20, H + 20); g.arc(W / 2, H / 2, (1 - p) * 1250, 0, TAU, true); g.fill('evenodd'); }
  } else if (type === 2) {
    for (let i = 0; i < 6; i++) {
      const pi = clamp(p * 1.7 - i * .14), y0 = i * H / 6 - 1, y1 = (i + 1) * H / 6 + 1, L = (W + 600) * pi;
      g.beginPath();
      if (!rev) { const xr = -300 + L; g.moveTo(-300, y0); g.lineTo(xr, y0); g.lineTo(xr - 160, y1); g.lineTo(-300, y1); }
      else { const xl = W + 300 - L; g.moveTo(W + 300, y0); g.lineTo(xl + 160, y0); g.lineTo(xl, y1); g.lineTo(W + 300, y1); }
      g.fill();
    }
  } else if (type === 3) {
    for (let i = 0; i < 12; i++) {
      const pi = clamp(p * 1.5 - (rev ? 11 - i : i) / 12 * .5), bh = H / 12 + 1, L = (W + 20) * pi;
      rev ? g.fillRect(W + 10 - L, i * H / 12 - 1, L, bh) : g.fillRect(-10, i * H / 12 - 1, L, bh);
    }
  } else if (type === 4) {
    const cell = 135, oy = (H - 15 * cell) / 2;
    for (let j = -1; j < 16; j++) for (let i = 0; i < 8; i++) {
      const cx = i * cell + cell / 2, cy = oy + j * cell + cell / 2;
      const s = clamp(p * 2 - (rev ? 1 - (cx + cy) / (W + H) : (cx + cy) / (W + H)) * .9) * cell * 1.04;
      g.fillRect(cx - s / 2, cy - s / 2, s, s);
    }
  } else if (type === 5) {
    if (!rev) { g.fillRect(-10, -10, (W / 2 + 10) * p, H + 20); g.fillRect(W - (W / 2 + 10) * p, -10, (W / 2 + 10) * p, H + 20); }
    else { g.fillRect(-10, -10, W + 20, (H / 2 + 10) * p); g.fillRect(-10, H - (H / 2 + 10) * p, W + 20, (H / 2 + 10) * p); }
  } else {
    rev ? g.fillRect(-10, H - (H + 10) * p, W + 20, (H + 10) * p + 10) : g.fillRect(-10, -10, W + 20, (H + 10) * p);
  }
}

function draw(t) {
  t = clamp(t, 0, DUR - 1 / 600);
  let si = 0; while (si < 7 && t >= BEATS.scenes[si + 1]) si++;
  const bi = Math.floor(t / BEAT + 1e-9), bt = t - bi * BEAT, strong = bi % 4 === 0, k = Math.exp(-bt * 11);
  const punch = 1 + (strong ? .03 : .012) * k, sh = (strong ? 24 : 9) * k;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, W, H);
  g.save();
  g.translate(W / 2 + (rnd(bi, 1) - .5) * 2 * sh, H / 2 + (rnd(bi, 2) - .5) * 2 * sh);
  g.scale(punch, punch); g.translate(-W / 2, -H / 2);
  SCENES[si](t - BEATS.scenes[si]);
  g.restore();
  for (let i = 0; i < TB.length; i++) {
    const d = t - TB[i]; if (d < -TW || d > TW) continue;
    const rev = d >= 0, lin = rev ? (TW - d) / TW : (d + TW) / TW;
    cover(i, E.inOutCubic(clamp(lin)), rev, TC[i]);
  }
}

window.seek = t => draw(t);
draw(0);
if (location.search.includes('play')) {
  const t0 = performance.now();
  (function loop() { draw(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); })();
}
</script>
</body>
</html>
