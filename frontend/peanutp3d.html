<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>PB&amp;J Peanut P</title>
<style>
  html, body { margin: 0; height: 100%; background: #F8F8F0; overflow: hidden; touch-action: none; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
  #spin { position: fixed; left: 50%; bottom: 9vh; transform: translateX(-50%); font: 400 13px/1.2 "Chivo Mono", ui-monospace, monospace; text-transform: uppercase; color: #463721; background: #FFE386; border: 2px solid #463721; border-radius: 999px; padding: 14px 26px; cursor: pointer; box-shadow: 0 4px 0 #463721; transition: transform .15s; }
  #spin:hover { transform: translateX(-50%) translateY(-2px) rotate(-2deg); }
  #spin:active { transform: translateX(-50%) translateY(3px); box-shadow: 0 1px 0 #463721; }
  .hint { position: fixed; left: 0; right: 0; bottom: 3vh; text-align: center; font: 400 12px/1.2 "Chivo Mono", ui-monospace, monospace; text-transform: uppercase; color: #463721; pointer-events: none; }
  .embed #spin, .embed .hint { display: none; }
  .embed, .embed body { background: transparent; }
</style>
</head>
<body>
<script>if (location.search.includes("embed")) document.documentElement.classList.add("embed");</script>
<canvas id="c"></canvas>
<button id="spin" type="button">Spin 360</button>
<div class="hint">Drag to spin</div>
<script type="module" src="/src/peanutp3d.js"></script>
</body>
</html>
