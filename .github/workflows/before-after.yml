name: Before and after
on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: '**/package-lock.json' }
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Build and shoot AFTER (this PR)
        working-directory: frontend
        run: |
          npm run build
          node scripts/screenshots.mjs dist /tmp/shots/after

      # main may still have the site in the top folder (before the frontend/ move)
      - name: Build and shoot BEFORE (main)
        run: |
          cp frontend/scripts/screenshots.mjs /tmp/screenshots.mjs
          git checkout -f origin/${{ github.base_ref }}
          if [ -f frontend/package.json ]; then cd frontend; fi
          mkdir -p scripts && cp /tmp/screenshots.mjs scripts/screenshots.mjs
          npm ci
          npm run build
          node scripts/screenshots.mjs dist /tmp/shots/before

      - name: Save screenshots on a side branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R=${{ github.repository }}; D=pr-${{ github.event.number }}
          URL=https://x-access-token:$GH_TOKEN@github.com/$R.git
          git clone -q --branch pr-screenshots --single-branch $URL /tmp/side 2>/dev/null || {
            mkdir /tmp/side && git -C /tmp/side init -q -b pr-screenshots && git -C /tmp/side remote add origin $URL; }
          cd /tmp/side
          git config user.name "pbj-bot"; git config user.email "bot@users.noreply.github.com"
          mkdir -p $D && rm -rf $D/* && cp -r /tmp/shots/before $D/before && cp -r /tmp/shots/after $D/after
          git add $D && git commit -qm "Screenshots for PR ${{ github.event.number }}"
          git push -q origin pr-screenshots
          echo "SHOTSHA=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Comment on the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin ${{ github.base_ref }} ${{ github.sha }}
          B=origin/${{ github.base_ref }}
          COMMITS=$(git rev-list --count $B..${{ github.sha }})
          STAT=$(git diff --shortstat $B...${{ github.sha }})
          R=${{ github.repository }}; D=pr-${{ github.event.number }}
          img() { echo "<img src=\"https://github.com/$R/blob/$SHOTSHA/$D/$1?raw=true\" width=\"100%\">"; }
          {
            echo "<!-- pbj-before-after -->"
            echo "## Before and after"
            echo "**$COMMITS commit(s)** · $STAT"
            echo
            for s in desktop phone; do
              echo "### ${s^}"
              echo "| Before (main) | After (this PR) |"; echo "|---|---|"
              for i in 1 2 3; do echo "| $(img before/$s-$i.png) | $(img after/$s-$i.png) |"; done
              echo
            done
          } > body.md
          ID=$(gh api repos/$R/issues/${{ github.event.number }}/comments --jq '.[] | select(.body | contains("pbj-before-after")) | .id' | head -1)
          if [ -n "$ID" ]; then gh api -X PATCH repos/$R/issues/comments/$ID -F body=@body.md; else gh pr comment ${{ github.event.number }} --body-file body.md; fi
