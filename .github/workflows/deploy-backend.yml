name: Deploy backend
# Deploys backend/ to Railway (project pbj-backend, service api) when a backend PR
# is squash-merged into main. Follows the PR title rules in AGENTS.md:
#   feat(backend): …  fix(backend): …  chore(backend): …  and GitHub's Revert "…(backend): …"
# Anything else (docs, other scopes) does not deploy.
on:
  push:
    branches: [main]
    paths: ["backend/**"]
  workflow_dispatch: # "Run workflow" button: deploy main by hand

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check the title
        id: title
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          EVENT: ${{ github.event_name }}
        run: |
          title=$(printf '%s' "$MESSAGE" | head -n 1)
          echo "Title: ${title:-<manual run>}"
          if [ "$EVENT" = "workflow_dispatch" ] || printf '%s' "$title" | grep -Eq '^((feat|fix|chore)\(backend\): |Revert ".*\(backend\): )'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not a feat/fix/chore/revert(backend) title: skipping deploy."
          fi

      - uses: actions/checkout@v4
        if: steps.title.outputs.deploy == 'true'

      - uses: actions/setup-python@v5
        if: steps.title.outputs.deploy == 'true'
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }

      - name: Tests pass
        if: steps.title.outputs.deploy == 'true'
        working-directory: backend
        run: pip install -r requirements-dev.txt && pytest

      - name: Deploy to Railway
        if: steps.title.outputs.deploy == 'true'
        working-directory: backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npm install -g @railway/cli
          railway up . --path-as-root --service api --environment production --ci -m "${GITHUB_SHA::7}"

      - name: Health check
        if: steps.title.outputs.deploy == 'true'
        run: |
          for i in $(seq 1 12); do
            curl -fsS https://api-production-bb76bfb9.up.railway.app/api/health && exit 0
            sleep 10
          done
          echo "Health check failed"; exit 1
