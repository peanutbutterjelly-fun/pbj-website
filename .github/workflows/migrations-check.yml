name: Migrations check
# On a PR that adds database migrations: shows which ones would be applied to the live
# Supabase project, and fails if they can't be. Changes nothing (dry run).
on:
  pull_request:
    branches: [main]
    paths: ["supabase/migrations/**", ".github/workflows/migrations-check.yml", ".github/workflows/deploy-backend.yml"]

jobs:
  dry-run:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: 2.98.2 }
      - name: Link the project
        run: supabase link --project-ref xpzrsslqfnhzqcxxkkjo
      - name: Migrations that would be applied
        run: supabase db push --dry-run | tee dry-run.txt
      - name: Summary
        if: always()
        run: |
          { echo "### Database migrations"; echo '```'; cat dry-run.txt 2>/dev/null || echo "(dry run failed, see the log)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
