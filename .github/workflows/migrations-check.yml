name: Migrations check
# On a PR that adds database migrations: shows which ones would be applied to the live
# Supabase project, and fails if they can't be. Changes nothing (dry run).
on:
  pull_request:
    branches: [main]
    paths: ["supabase/migrations/**", ".github/workflows/migrations-check.yml", ".github/workflows/deploy-backend.yml"]

jobs:
  dry-run:
    runs-on: ubuntu-latest
    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: 2.98.2 }
      - name: Database address
        # The IPv4 pooler (GitHub's machines can't reach Supabase's IPv6-only direct address).
        # Built from the password secret, URL-encoded, and masked in the logs.
        run: |
          pw=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["SUPABASE_DB_PASSWORD"], safe=""))')
          echo "::add-mask::$pw"
          echo "DB_URL=postgresql://postgres.xpzrsslqfnhzqcxxkkjo:${pw}@aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres" >> "$GITHUB_ENV"
      - name: Migrations that would be applied
        run: |
          set -o pipefail
          supabase db push --dry-run --db-url "$DB_URL" 2>&1 | tee dry-run.txt
      - name: Summary
        if: always()
        run: |
          { echo "### Database migrations"; echo '```'; cat dry-run.txt 2>/dev/null || echo "(dry run failed, see the log)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
